<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Powerbuilding">
<meta name="theme-color" content="#111417">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.PB_APP=true;</script></head><body>
<title>Powerbuilding</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: single phone column, sticky week/day header, fixed bottom tab bar; plate colours mark main lifts */
:root{
  --bg:#eef0ee; --surface:#ffffff; --sunk:#e3e6e3; --line:#d3d7d3;
  --fg:#16191b; --muted:#5d6560; --accent:#1f45c4; --accent-ink:#ffffff;
  --plate:#c8322b; --good:#1d7a45; --warn:#a86a00;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
  --stage:#151a20; --stage-hi:#262e38; --stage-ink:#9aa6b2; --fig:#2c343e; --fig-hi:#3b4552; --fig-line:#4a5563;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111417; --surface:#1a1e22; --sunk:#232830; --line:#2e343b;
  --fg:#eceeed; --muted:#9aa29e; --accent:#7f9cff; --accent-ink:#0d1330;
  --plate:#ff6b5e; --good:#4fc681; --warn:#e8a93a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111417; --surface:#1a1e22; --sunk:#232830; --line:#2e343b;
  --fg:#eceeed; --muted:#9aa29e; --accent:#7f9cff; --accent-ink:#0d1330;
  --plate:#ff6b5e; --good:#4fc681; --warn:#e8a93a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
.num,input,.tab{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.toprow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.toprow h1{font-size:30px;line-height:1}
.sync{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;min-height:34px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.today{box-shadow:inset 0 -3px 0 var(--accent)}
.chip.rest{color:var(--muted)}
.chip .sub{font-weight:500;opacity:.7}

main{display:grid;gap:14px;padding-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--plate)}
.btn.block{width:100%}
.field{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 10px;font:inherit;color:var(--fg);min-height:42px;width:100%;min-width:0}

/* day title */
.dayhead{display:grid;gap:4px;padding-top:4px}
.dayhead h2{font-size:34px;line-height:1.02}
.dayhead .meta{color:var(--muted);font-size:14px}

/* bodyweight */
.bw{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.bwbig{font-family:var(--display);font-size:36px;font-weight:700;line-height:1}
.bwbig small{font-size:16px;color:var(--muted);font-weight:600;margin-left:3px}
.delta{font-size:13px;font-weight:600}
.delta.up{color:var(--warn)} .delta.down{color:var(--good)}

/* exercise */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ex.main{border-left:5px solid var(--plate)}
.exhead{padding:12px 12px 6px 14px;display:grid;gap:4px}
.exname{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.exname h3{font-size:22px;line-height:1.1}
.badge{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--plate);margin-bottom:2px}
.target{font-size:14px;color:var(--fg)}
.target b{font-weight:600}
.target .sep{color:var(--line);margin:0 4px}
.last{font-size:13px;color:var(--muted)}
.dots{min-width:40px;min-height:36px;border:none;background:transparent;font-size:20px;line-height:1;color:var(--muted);border-radius:8px}
.edit{background:var(--sunk);padding:10px 14px;display:grid;gap:8px;border-top:1px solid var(--line)}
.sets{display:grid;padding:4px 10px 10px}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 1fr 48px;gap:6px;align-items:center;padding:4px 0}
.setrow.head{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-bottom:0}
.setrow.head span{text-align:center}
.setno{font-family:var(--display);font-weight:700;font-size:18px;text-align:center;color:var(--muted)}
.setrow input{width:100%;min-width:0;text-align:center;border:1px solid var(--line);background:var(--sunk);border-radius:8px;height:44px;font:600 18px var(--body);color:var(--fg);padding:0 4px}
.setrow input::placeholder{color:var(--muted);opacity:.55;font-weight:500}
.setrow.done input{background:transparent;border-color:transparent}
.check{height:44px;border-radius:10px;border:2px solid var(--line);background:transparent;font-size:20px;font-weight:700;color:transparent}
.setrow.done .check{background:var(--good);border-color:var(--good);color:#fff}
.setrow.done .setno{color:var(--good)}
.sets.ranked .setrow{grid-template-columns:28px 1fr 1fr 1fr 34px 44px}
.medal{width:32px;height:32px;border-radius:50%;display:grid;place-content:center;justify-items:center;line-height:.95;font:700 13px var(--display);letter-spacing:.02em;justify-self:center;color:#1b1406;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45),0 1px 2px rgba(0,0,0,.25)}
.m-gold{background:radial-gradient(circle at 35% 30%,#ffe9a3,#d9a520 60%,#a87a0c)}
.m-plat{background:radial-gradient(circle at 35% 30%,#f4fbff,#a9c4d6 60%,#6f8ea3)}
.m-dia{background:radial-gradient(circle at 35% 30%,#d9f6ff,#3fb8e8 60%,#1d7fb0);color:#04263a}
.m-master{background:radial-gradient(circle at 35% 30%,#e3d4ff,#8b5cf6 60%,#5b2fc2);color:#fff}
button.medal{border:none;padding:0;cursor:pointer}
.medal i{font-style:normal;font-size:8.5px;letter-spacing:.06em;opacity:.85}
.m-gm{background:radial-gradient(circle at 35% 30%,#ffc4c9,#e0384f 60%,#9c1730);color:#fff}
.m-champ{background:radial-gradient(circle at 35% 30%,#7fe0d0,#0f8a7c 60%,#08524a);color:#ffe28a}
.m-titan{background:radial-gradient(circle at 35% 30%,#c9d1dc,#4a5566 60%,#1e252f);color:#f4f7fb}
.m-legend{background:conic-gradient(from 200deg,#ff3d2e,#ffb02e,#ff3d2e,#c81e5a,#ff3d2e);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.ranks td,.ranks th{text-align:center} .ranks td:first-child,.ranks th:first-child{text-align:left}
.rankname{display:flex;align-items:center;gap:8px;font-weight:600}
.rankname .medal{width:28px;height:28px;font-size:11px;justify-self:start}
.bodies{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bodies figure{margin:0;display:grid;gap:4px;justify-items:center}
.bodies figcaption{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
svg.body{width:100%;max-width:200px;height:auto}
.bodies{background:radial-gradient(ellipse at 50% 30%,var(--stage-hi),var(--stage) 70%);border-radius:12px;padding:14px 6px 10px}
.bodies figcaption{color:var(--stage-ink)}
svg.body .sil{stroke:var(--fig-line);stroke-width:1;pointer-events:none}
svg.body .mu{cursor:pointer}
svg.body .mu path{stroke:rgba(0,0,0,.35);stroke-width:.8;stroke-linejoin:round}
svg.body .mu .gloss{stroke:none;pointer-events:none}
svg.body .mu.sel path:first-of-type{stroke:#fff;stroke-width:2}
svg.body .detail{fill:none;stroke:rgba(0,0,0,.3);stroke-width:.9;stroke-linecap:round;pointer-events:none}
@media (prefers-reduced-motion:no-preference){svg.body .mu path{transition:fill .3s}}
.heat{height:10px;border-radius:5px;background:linear-gradient(90deg,hsl(0 72% 50%),hsl(45 85% 50%),hsl(130 55% 42%))}
.mbar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;flex:1;min-width:60px}
.mbar span{display:block;height:100%}
.mrow{display:flex;align-items:center;gap:10px;padding:6px 0;border:none;background:transparent;width:100%;text-align:left;font:inherit;color:inherit}
.mrow .mn{width:96px;font-weight:600;font-size:14px}
.mrow .mv{width:44px;text-align:right;font-size:13px;color:var(--muted)}
.mrow.sel .mn{color:var(--accent)}
.setbtns{display:flex;gap:4px;justify-content:flex-end;padding:0 6px 8px}

.addex{border:1.5px dashed var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
textarea.field{min-height:70px;resize:vertical}

/* rest day */
.restcard{padding:26px 18px;text-align:left}
.restcard h2{font-size:44px}

/* rest timer + nav */
.timer{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:25;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.timer .in{max-width:560px;margin:0 auto 8px;background:var(--fg);color:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.timer .t{font-family:var(--display);font-size:28px;font-weight:700;flex:1}
.timer .t small{font-family:var(--body);font-size:12px;opacity:.7;font-weight:500;letter-spacing:.06em;text-transform:uppercase;margin-right:8px}
.timer button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 10px;font-weight:600;min-height:38px}
.timer.over .in{background:var(--good);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:none;background:transparent;height:60px;font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tab.on{color:var(--fg);box-shadow:inset 0 3px 0 var(--accent)}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:8px;padding:8px 10px}
.stat b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
svg.chart{width:100%;height:auto;display:block;max-width:100%}
svg.chart text{fill:var(--muted);font:11px var(--body)}
.list{display:grid}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.li:first-child{border-top:none}
.li .l{min-width:0}
.li h3{font-size:19px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
table.t th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;border-top:none}
.tscroll{overflow-x:auto}
.note{font-size:14px;line-height:1.5;color:var(--fg)}
.note li{margin-bottom:6px}
.done-banner{background:var(--good);color:#fff;border-radius:var(--r);padding:14px;display:grid;gap:4px}
.done-banner h3{font-size:24px}
@media (prefers-reduced-motion:no-preference){.setrow.done .check{transition:background .15s}}
</style>

<div class="wrap">
  <header id="hdr"></header>
  <main id="main"><div class="card"><p class="muted">Loading your plan…</p></div></main>
</div>
<div class="timer" id="timer" hidden></div>
<nav><div class="in" id="nav"></div></nav>

const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const SHORT = {Monday:"Mon",Tuesday:"Tue",Wednesday:"Wed",Thursday:"Thu",Friday:"Fri",Saturday:"Sat",Sunday:"Sun"};
const LS_KEY = "pbLog.docs.v1";

/* ---------- dates ---------- */
const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); };
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const dayName = s => DAYS[(parseISO(s).getDay()+6)%7];
const mondayOf = s => addDays(s, -((parseISO(s).getDay()+6)%7));
const fmtDate = s => parseISO(s).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const TODAY = iso(new Date());

const pending = {}, timers = {}, inflight = {};
function save(id, data){
  docs[id] = data; writeLocal();
  if (!col) return;
  pending[id] = data; clearTimeout(timers[id]);
  timers[id] = setTimeout(() => flush(id), 700);
}
async function flush(id){
  if (inflight[id]) { timers[id] = setTimeout(() => flush(id), 400); return; }
  const d = pending[id]; if (!d) return; delete pending[id];
  inflight[id] = true; setSync("Saving…");
  try { await col.doc(id).set(JSON.parse(JSON.stringify(d))); setSync("Synced"); }
  catch (e) { setSync(e && e.code === "quota_exceeded" ? "Storage full: delete old sessions" : "Saved on this phone, sync failed"); }
  inflight[id] = false;
}
async function removeDoc(id){
  delete docs[id]; writeLocal();

}
function setSync(m){ syncMsg = m; const el = document.getElementById("sync"); if (el) el.textContent = m; }

async function connectDb(){
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const uid = user && await user.id();
    if (!db || !uid) return;
    const c = db.collection("data/users/" + uid);
    const snap = await c.get();
    const remote = {};
    snap.docs.forEach(d => { if (d.exists) remote[d.id] = d.data(); });
    col = c;
    // anything only on this phone gets pushed up; the synced copy wins otherwise
    for (const [id, d] of Object.entries(docs)) if (!remote[id]) save(id, d);
    Object.assign(docs, JSON.parse(JSON.stringify(remote)));
    writeLocal();
    setSync("Synced"); applyPlan();
    if (!state.dirty) { state.session = null; render(); }
  } catch { /* stay on local storage */ }
}

/* ---------- model ---------- */
const settings = () => docs.settings || null;
const bwEntries = () => (docs.bodyweight && docs.bodyweight.entries) || {};
const sessions = () => Object.entries(docs).filter(([,d]) => d && d.type === "session").map(([id,d]) => ({id, ...d})).sort((a,b) => (b.date+b.day).localeCompare(a.date+a.day));

function blockWeekFor(date){
  const s = settings(); if (!s) return {week:1, block:1};
  const w = Math.floor((parseISO(date) - parseISO(s.cycleStart)) / (7*864e5));
  return {week: ((w % 4) + 4) % 4 + 1, block: Math.floor(w / 4) + 1};
}
const planDay = (week, day) => PLAN.weeks[week-1].days[day];
/* maxes: your own numbers override the plan's; barbell loads scale with them */
const LIFTS = ["bench","squat","deadlift"];
const maxes = () => ({...PLAN.oneRM, ...((docs.settings && docs.settings.maxes) || {})});
function liftOf(name){
  if (/bench/i.test(name)) return "bench";
  if (/deadlift/i.test(name)) return "deadlift";
  if (/squat/i.test(name) && !/hack/i.test(name)) return "squat";
  return null;
}
const r25 = n => Math.round(n/2.5)*2.5;
/* ranks: estimated 1RM divided by bodyweight; 8 tiers, each below Legend split into divisions III, II, I */
const TIERS = [{k:"gold",n:"Gold",a:"G"},{k:"plat",n:"Platinum",a:"P"},{k:"dia",n:"Diamond",a:"D"},{k:"master",n:"Master",a:"M"},{k:"gm",n:"Grandmaster",a:"GM"},{k:"champ",n:"Champion",a:"C"},{k:"titan",n:"Titan",a:"T"},{k:"legend",n:"Legend",a:"L"}];
// ×bodyweight needed to enter Platinum … Legend
const STD = {bench:[0.75,1,1.25,1.5,1.75,2,2.25], squat:[1,1.25,1.5,1.85,2.2,2.5,2.85], deadlift:[1.25,1.5,1.85,2.2,2.5,2.8,3.15]};
const DIVS = ["III","II","I"];
function ladder(lift){
  const s = STD[lift], starts = [s[0]*0.6, ...s], out = [];
  TIERS.forEach((tr, i) => {
    if (tr.k === "legend") { out.push({...tr, div:"", min:starts[i]}); return; }
    const lo = starts[i], hi = starts[i+1];
    DIVS.forEach((d, j) => out.push({...tr, div:d, min: lo + (hi-lo)*j/3}));
  });
  return out;
}
const LADDER = Object.fromEntries(["bench","squat","deadlift"].map(l => [l, ladder(l)]));
const rankLift = name => /close-grip|romanian/i.test(name) ? null : liftOf(name);
function bwOn(date){
  const e = bwEntries(), ks = Object.keys(e).sort(); if (!ks.length) return null;
  const before = ks.filter(d => d <= date); return e[before.length ? before[before.length-1] : ks[0]];
}
function rankIndex(lift, e1, bw){ const r = e1/bw, L = LADDER[lift]; let i = 0; while (i+1 < L.length && r >= L[i+1].min) i++; return i; }
function tierFor(lift, e1, bw){
  if (!lift || !bw || !(e1 > 0)) return null;
  return LADDER[lift][rankIndex(lift, e1, bw)];
}
const rankName = r => r.div ? `${r.n} ${r.div}` : r.n;
/* every exercise gets a ladder: Platinum entry and Legend entry, evenly spaced between
   basis "ratio": estimated max ÷ bodyweight · "added": (bodyweight + added kg) estimated max ÷ bodyweight · "reps": reps in one set */
const lin = (p, l) => Array.from({length:7}, (_, k) => +(p + (l-p)*k/6).toFixed(3));
const EX_STD = {
  "Incline DB Press": {s:lin(.2,.75), note:"weight of one dumbbell"},
  "Weighted Dips": {basis:"added", s:lin(1.15,2.1)},
  "Pec Deck": {s:lin(.5,1.6), note:"stack weight; machines vary"},
  "Straight-Bar Triceps Pushdown": {s:lin(.3,1)},
  "DB Lateral Raise": {s:lin(.08,.4), note:"weight of one dumbbell"},
  "Hack Squat": {s:lin(.75,3), note:"plates loaded on the sled"},
  "Leg Extension": {s:lin(.5,1.75), note:"stack weight; machines vary"},
  "Seated Leg Curl": {s:lin(.4,1.5), note:"stack weight; machines vary"},
  "Standing Calf Raise": {s:lin(.75,3)},
  "Hanging Leg Raise": {basis:"reps", s:lin(8,30)},
  "Weighted Pull-Up": {basis:"added", s:lin(1.15,2)},
  "Barbell Row": {s:lin(.6,1.6)},
  "Seated DB Shoulder Press": {s:lin(.2,.65), note:"weight of one dumbbell"},
  "Seated Cable Row": {s:lin(.5,1.6)},
  "Face Pull": {s:lin(.2,.85)},
  "Barbell Curl + Hammer Curl": {s:lin(.3,.95), note:"barbell curl weight"},
  "Romanian Deadlift": {s:lin(1,2.75)},
  "Lying Leg Curl": {s:lin(.3,1.2), note:"stack weight; machines vary"},
  "45-Degree Back Extension": {basis:"added", s:lin(1.2,2.2), note:"leave kg empty for bodyweight only"},
  "Cable Crunch": {s:lin(.4,1.6)},
  "Close-Grip Bench Press": {s:lin(.65,1.9)},
  "Chest-Supported Row": {s:lin(.4,1.3), note:"total weight moved"},
  "Lat Pulldown": {s:lin(.55,1.5)},
  "EZ Curl + Rope Pushdown (superset)": {s:lin(.3,.95), note:"EZ curl weight"},
  _generic: {s:lin(.4,1.5), note:"general standard for exercises not in the plan"}
};
const baseName = n => String(n).replace(/ \(top single\)$/, "");
function stdFor(name){
  const b = baseName(name), big = /close-grip|romanian|hack/i.test(b) ? null : liftOf(b);
  if (big) return {key:big, basis:"ratio", s:STD[big], note: /paused/i.test(b) ? `ranked on the ${big} ladder` : ""};
  const d = EX_STD[b] || EX_STD._generic;
  return {key: EX_STD[b] ? b : "_generic", basis:"ratio", note:"", ...d};
}
const LAD_CACHE = {};
function ladderOf(std){
  if (LAD_CACHE[std.key]) return LAD_CACHE[std.key];
  const starts = [std.s[0]*0.6, ...std.s], out = [];
  TIERS.forEach((tr, i) => {
    if (tr.k === "legend") { out.push({...tr, div:"", min:starts[i]}); return; }
    const lo = starts[i], hi = starts[i+1];
    DIVS.forEach((d, j) => out.push({...tr, div:d, min: lo + (hi-lo)*j/3}));
  });
  return LAD_CACHE[std.key] = out;
}
// score of one set on its exercise's basis (x is compared with ladder mins)
function setScore(std, st, bw){
  const kg = parseFloat(st.kg) || 0, reps = +st.reps, rpe = +st.rpe;
  if (!(reps > 0)) return null;
  if (std.basis === "reps"){ const r = reps + (rpe >= 5 && rpe <= 10 ? 10 - rpe : 0); return {x:r, label:`${r} reps (counting reps left)`}; }
  if (!bw) return null;
  const load = std.basis === "added" ? bw + kg : kg, e = e1rm(load, reps, rpe);
  if (!(e > 0)) return null;
  return {x:e/bw, e, label: std.basis === "added" ? `about +${round1(e - bw)} kg for one rep` : `about ${round1(e)} kg max`};
}
function rankAt(L, x){ let i = 0; while (i+1 < L.length && x >= L[i+1].min) i++; return i; }
// what a rank needs, in the units the person logs
function needFor(std, min, bw){
  if (std.basis === "reps") return `${Math.ceil(min)} reps`;
  const e = min*bw, five = e/(1+7/30);
  return std.basis === "added" ? `+${Math.max(0, r25(five - bw))} kg × 5 @ RPE 8` : `${r25(five)} kg × 5 @ RPE 8`;
}
function exHistory(name){
  const b = baseName(name), std = stdFor(b), L = ladderOf(std), out = [];
  for (const s of sessions()){
    const bw = bwOn(s.date);
    const sets = (s.exercises||[]).filter(e => baseName(e.name) === b).flatMap(e => e.sets).filter(x => x.done);
    let best = null;
    for (const st of sets){ const sc = setScore(std, st, bw); if (sc && (!best || sc.x > best.sc.x)) best = {sc, st}; }
    if (best) out.push({date:s.date, bw, st:best.st, sc:best.sc, rank:L[rankAt(L, best.sc.x)], i:rankAt(L, best.sc.x)});
  }
  return out;
}
const medal = (tier, label, name) => {
  if (!tier) return `<span></span>`;
  const inner = `<b>${tier.a}</b>${tier.div ? `<i>${tier.div}</i>` : ""}`, l = esc(label || rankName(tier));
  return name ? `<button type="button" class="medal m-${tier.k}" data-act="expage" data-name="${esc(name)}" title="${l}" aria-label="${l}, open ranks for ${esc(name)}">${inner}</button>` : `<span class="medal m-${tier.k}" title="${l}" aria-label="${l}">${inner}</span>`;
};
function scaleEx(e){
  const lift = liftOf(e.name);
  if (e.targetKg == null || !lift) return e;
  const kg = r25(e.targetKg * maxes()[lift] / PLAN.oneRM[lift]);
  if (kg === e.targetKg) return e;
  const pct = e.pct1RM ? ` (${Math.round(kg / maxes()[lift] * 100)}%)` : "";
  return {...e, targetKg: kg, weight: `${kg} kg${pct}`};
}

function firstNum(s){ const m = String(s||"").match(/[\d.]+/); return m ? m[0] : ""; }
function restSecs(s){
  s = String(s||""); const n = parseFloat(firstNum(s)) || 90;
  return /min/.test(s) ? n*60 : n;
}
function newSet(){ return {kg:"", reps:"", rpe:"", done:false}; }
function buildSession(week, day, date){
  const pd = planDay(week, day);
  return {type:"session", date, day, week, title: pd.title, started: Date.now(), finished: false, notes:"",
    exercises: pd.exercises.map(scaleEx).map(e => ({name:e.name, main:e.main, plan:{sets:e.sets, reps:e.reps, weight:e.weight, targetKg:e.targetKg, rpe:e.rpe, rest:e.rest}, sets: Array.from({length:e.sets}, newSet)}))};
}
// most recent logged sets of an exercise before a given session
function lastFor(name, beforeId){
  for (const s of sessions()){
    if (s.id === beforeId) continue;
    if (beforeId && docs[beforeId] && (s.date + s.day) > (docs[beforeId].date + docs[beforeId].day)) continue;
    const ex = (s.exercises||[]).find(e => e.name === name);
    if (ex){ const done = ex.sets.filter(x => x.done && x.kg !== ""); if (done.length) return {date:s.date, sets:done}; }
  }
  return null;
}
// Epley, counting reps left in the tank from RPE when it was logged
const e1rm = (kg, reps, rpe) => { const rir = rpe >= 5 && rpe <= 10 ? 10 - rpe : 0; const r = reps + rir; return (kg > 0 && reps > 0 && r <= 30) ? kg * (1 + (r === 1 ? 0 : r/30)) : 0; };
const round1 = n => Math.round(n*10)/10;

const tw = blockWeekFor(TODAY);

function currentSession(){
  if (state.openId && docs[state.openId]) { state.sessionId = state.openId; return docs[state.openId]; }
  // a session already logged for this week and day in the current block shows up again on any later date
  const t = blockWeekFor(TODAY);
  const blockStart = addDays(settings() ? settings().cycleStart : mondayOf(TODAY), (t.block-1)*28);
  const logged = sessions().find(x => x.week === state.week && x.day === state.day && x.date >= blockStart && x.date < addDays(blockStart, 28));
  if (logged) { state.sessionId = logged.id; return docs[logged.id]; }
  // today's session for this day keeps its original id; browsing a different week on the same day gets its own id
  const base = `s-${TODAY}-${state.day}`;
  const id = (!docs[base] || docs[base].week === state.week) ? base : `${base}-w${state.week}`;
  state.sessionId = id;
  if (docs[id]) return docs[id];
  if (!state.session || state.session.__key !== id + state.week){
    if (planDay(state.week, state.day).rest) { state.session = null; return null; }
    state.session = buildSession(state.week, state.day, TODAY);
    Object.defineProperty(state.session, "__key", {value: id + state.week, enumerable:false});
  }
  return state.session;
}

/* charts */
function lineChart(pts, unit, refY){
  if (pts.length < 2) return `<p class="empty">${pts.length ? "One entry so far. The chart appears after the second." : "Nothing logged yet."}</p>`;
  const W = 340, H = 170, L = 36, R = 10, T = 12, B = 22;
  const xs = pts.map(p => parseISO(p.x).getTime()), ys = pts.map(p => p.y).concat(refY ? [refY] : []);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = Math.max((y1-y0)*0.15, 0.5); y0 -= pad; y1 += pad;
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const X = t => L + (x1===x0 ? 0.5 : (t-x0)/(x1-x0)) * (W-L-R), Y = v => T + (1-(v-y0)/(y1-y0)) * (H-T-B);
  const ticks = [0,1,2].map(k => y0 + (y1-y0)*(k+0.5)/3);
  const line = pts.map((p,i) => `${i?"L":"M"}${X(xs[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const area = `${line}L${X(xs[xs.length-1]).toFixed(1)},${H-B}L${X(xs[0]).toFixed(1)},${H-B}Z`;
  const lp = pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart of ${unit}">
    ${ticks.map(v => `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${round1(v)}</text>`).join("")}
    ${refY ? `<line x1="${L}" x2="${W-R}" y1="${Y(refY)}" y2="${Y(refY)}" stroke="var(--plate)" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W-R}" y="${Y(refY)-5}" text-anchor="end" style="fill:var(--plate)">plan 1RM ${refY}</text>` : ""}
    <path d="${area}" fill="var(--accent)" opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${X(xs[xs.length-1])}" cy="${Y(lp.y)}" r="4.5" fill="var(--accent)"/>
    <text x="${L}" y="${H-6}">${esc(fmtDate(pts[0].x))}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${esc(fmtDate(lp.x))}</text>
  </svg>`;
}
function exerciseHistory(name){
  const out = [];
  for (const s of sessions().slice().reverse()){
    const exs = (s.exercises||[]).filter(e => e.name === name || e.name === name + " (top single)"); if (!exs.length) continue;
    const done = exs.flatMap(e => e.sets).filter(x => x.done && +x.kg > 0 && +x.reps > 0);
    if (!done.length) continue;
    const best = done.reduce((a,x) => e1rm(+x.kg,+x.reps,+x.rpe) > e1rm(+a.kg,+a.reps,+a.rpe) ? x : a, done[0]);
    const top = done.reduce((a,x) => +x.kg > +a.kg ? x : a, done[0]);
    out.push({date:s.date, e1:round1(e1rm(+best.kg,+best.reps,+best.rpe)), top, vol: done.reduce((a,x)=>a + x.kg*x.reps, 0), sets: done.length});
  }
  return out;
}

function bodySvg(parts, lines, w, label){
  const id = label.toLowerCase();
  return `<svg class="body" viewBox="0 0 160 345" role="img" aria-label="${label} muscle map">
    <defs><linearGradient id="shade-${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient>

    <path class="sil" d="${SIL_D}" fill="url(#skin-${id})"/>
    ${parts.map(([m, d]) => `<g class="mu ${state.muscle === m ? "sel" : ""}" data-act="muscle" data-m="${m}"><title>${MUSCLES[m]}: ${round1(w.sets[m])} sets</title><path d="${d}" fill="${heat(w.sets[m])}"/><path class="gloss" d="${d}" fill="url(#shade-${id})"/></g>`).join("")}
    <path class="detail" d="${lines}"/></svg>`;
}
function renderBody(){
  const w = weekMuscles(), m = state.muscle;
  const list = Object.keys(MUSCLES).sort((a, b) => w.sets[a] - w.sets[b]);
  const sel = m ? `<div class="stat"><b style="font-size:20px">${MUSCLES[m]} · ${round1(w.sets[m])} sets</b>
    <span>${Object.entries(w.by[m]).length ? Object.entries(w.by[m]).map(([n, v]) => `${esc(n)} ${round1(v)}`).join(" · ") : "Not trained yet this week."}</span></div>` : `<p class="small muted">Tap a muscle to see which exercises hit it.</p>`;
  return `<div class="card"><div class="spread"><h2 style="font-size:24px">This week's muscles</h2><span class="small muted">from ${esc(fmtDate(w.start))}</span></div>
    <div class="bodies"><figure>${bodySvg(FRONT, FRONT_LINES, w, "Front")}<figcaption>Front</figcaption></figure><figure>${bodySvg(BACK, BACK_LINES, w, "Back")}<figcaption>Back</figcaption></figure></div>
    <div><div class="heat"></div><div class="spread small muted" style="margin-top:4px"><span>0 sets</span><span>5</span><span>10+ sets</span></div></div>
    ${sel}</div>
  <div class="card"><h2 style="font-size:22px">Sets per muscle</h2><div>${list.map(k => `<button class="mrow ${m === k ? "sel" : ""}" data-act="muscle" data-m="${k}"><span class="mn">${MUSCLES[k]}</span><span class="mbar"><span style="width:${Math.min(w.sets[k], 10)*10}%;background:${heat(w.sets[k])}"></span></span><span class="mv num">${round1(w.sets[k])}</span></button>`).join("")}</div>
    <p class="small muted">Counts ticked sets from Monday to Sunday. The main muscle of an exercise gets a full set and helper muscles get half, so 4 sets of bench is 4 for chest and 2 each for triceps and front delts. About 10 hard sets a week is enough to grow a muscle.</p></div>`;
}
function renderExPage(){
  const name = state.exPage, std = stdFor(name), L = ladderOf(std), bw = bwOn(TODAY), h = exHistory(name);
  const best = h.reduce((a, x) => (!a || x.sc.x > a.sc.x) ? x : a, null);
  const cur = best ? rankAt(L, best.sc.x) : -1, nx = L[cur+1];
  const basis = std.basis === "reps" ? "Ranked by reps in one set, counting the reps you had left from RPE."
    : std.basis === "added" ? "Ranked by your one-rep max with bodyweight plus added weight, divided by your bodyweight. Log only the added kg."
    : "Ranked by your estimated one-rep max divided by your bodyweight.";
  const cut = r => std.basis === "reps" ? `${Math.ceil(r.min)} reps` : !bw ? "–" : std.basis === "added" ? `+${Math.max(0, r25(r.min*bw - bw))} kg` : `${r25(r.min*bw)} kg`;
  return `<div class="row"><button class="btn ghost" data-act="expage-close">← Back</button></div>
  <div class="card"><div class="eyebrow">Exercise ranks</div><h2 style="font-size:30px">${esc(baseName(name))}</h2>
    <p class="small muted">${basis}${std.note ? ` Weight used: ${esc(std.note)}.` : ""}</p>
    ${best ? `<div class="li" style="border:none"><div class="rankname">${medal(L[cur])}<span>${rankName(L[cur])}<br><span class="small muted">Best: ${esc(best.st.kg || "bodyweight")}${best.st.kg ? " kg" : ""} × ${esc(best.st.reps)}${best.st.rpe ? ` @ RPE ${esc(best.st.rpe)}` : ""} · ${esc(fmtDate(best.date))}</span></span></div></div>
      ${nx ? `<div class="stat"><span>Next: <b style="display:inline;font-size:16px">${rankName(nx)}</b></span><div class="small">Needs about ${needFor(std, nx.min, bw || best.bw)}${std.basis !== "reps" ? " (or the same max with other reps)" : ""}.</div></div>` : `<div class="stat"><b>Top rank reached</b></div>`}`
      : `<p class="empty">No ranked sets yet. Tick a set of this exercise to earn your first medal.</p>`}
  </div>
  <div class="card"><h2 style="font-size:22px">Rank ladder</h2><p class="small muted">${std.basis === "reps" ? "Reps in one set" : `${std.basis === "added" ? "Added weight for one rep" : "Estimated max"} at your bodyweight of ${bw ?? "–"} kg`} to enter each rank.</p>
    <div class="tscroll"><table class="t num ranks">${L.map((r, i) => `<tr${i === cur ? ' style="background:var(--sunk)"' : ""}><td><span class="rankname">${medal(r)}${rankName(r)}${i === cur ? ' <span class="small muted">· you</span>' : ""}</span></td><td>${i === 0 ? "start" : cut(r)}</td></tr>`).reverse().join("")}</table></div></div>
  <div class="card"><h2 style="font-size:22px">Medal history</h2>${h.length ? `<div class="list">${h.map(x => `<div class="li"><div class="rankname">${medal(x.rank)}<span>${rankName(x.rank)}<br><span class="small muted">${esc(x.st.kg || "bodyweight")}${x.st.kg ? " kg" : ""} × ${esc(x.st.reps)}${x.st.rpe ? ` @ ${esc(x.st.rpe)}` : ""}</span></span></div><span class="small muted">${esc(fmtDate(x.date))}</span></div>`).join("")}</div>` : `<p class="empty">Nothing yet.</p>`}</div>`;
}
/* backup: one JSON blob with every saved document */
function backupText(){ return JSON.stringify({app:"pbLog", version:1, exported:new Date().toISOString(), docs}); }
function mergeDocs(inc){
  const cnt = x => (x.exercises || []).reduce((a, e) => a + (e.sets || []).filter(s => s.done).length, 0);
  let n = 0;
  for (const [id, d] of Object.entries(inc)){
    if (!d || typeof d !== "object" || !/^[A-Za-z0-9_.~:@+-]+$/.test(id)) continue;
    const cur = docs[id];
    if (d.type === "session"){ if (!cur || cnt(d) > cnt(cur)) { save(id, d); n++; } }
    else if (d.type === "bodyweight"){ const entries = {...(d.entries || {}), ...((cur && cur.entries) || {})}; if (!cur || Object.keys(entries).length > Object.keys(cur.entries || {}).length) { save(id, {type:"bodyweight", entries}); n++; } }
    else if (d.type === "settings"){ save(id, cur ? {...cur, ...d} : d); n++; }
  }
  return n;
}
async function restoreBackup(){
  const msg = $("imp-msg"); let txt = $("imp-text").value.trim();
  const f = $("imp-file").files && $("imp-file").files[0];
  if (!txt && f) txt = await f.text();
  let data = null; try { data = JSON.parse(txt); } catch {}
  if (!data || data.app !== "pbLog" || !data.docs){ msg.textContent = "That isn't a tracker backup. Copy it again from the other version and paste the whole thing."; return; }
  const n = mergeDocs(data.docs); applyPlan(); state.session = null;
  render(); const m2 = $("imp-msg"); if (m2) m2.textContent = n ? `Restored ${n} item${n === 1 ? "" : "s"}. Check the Log tab.` : "Everything in that backup was already here.";
}
async function backupSave(btn){
  const name = `powerbuilding-backup-${TODAY}.json`, text = backupText();
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({filename:name, data:new Blob([text], {type:"application/json"})}); btn.textContent = "Saved"; return; }
  } catch (e) { if (e && e.code === "declined") return; }
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type:"application/json"})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); btn.textContent = "Saved"; }
  catch { btn.textContent = "Use Copy backup instead"; }
}
function renderNav(){
  $("nav").innerHTML = [["today","Today"],["body","Body"],["progress","Progress"],["log","Log"],["plan","Plan"]].map(([k,l]) => `<button class="tab ${state.tab===k?"on":""}" data-act="tab" data-v="${k}" ${state.tab===k?'aria-current="page"':""}>${l}</button>`).join("");
}
function render(){
  renderHeader(); renderNav();
  $("main").innerHTML = state.exPage ? renderExPage() : state.tab === "today" ? renderToday() : state.tab === "body" ? renderBody() : state.tab === "progress" ? renderProgress() : state.tab === "log" ? renderLog() : renderPlan();
}

/* ---------- rest timer ---------- */
let tick = null;
function startTimer(secs){
  state.timer = {end: Date.now() + secs*1000}; clearInterval(tick);
  tick = setInterval(drawTimer, 250); drawTimer();
}
function drawTimer(){
  const el = $("timer"); if (!state.timer){ el.hidden = true; clearInterval(tick); return; }
  const left = Math.round((state.timer.end - Date.now())/1000);
  const a = Math.abs(left), txt = `${left<0?"+":""}${Math.floor(a/60)}:${String(a%60).padStart(2,"0")}`;
  el.hidden = false; el.classList.toggle("over", left <= 0);
  el.innerHTML = `<div class="in"><div class="t num"><small>${left>0?"Rest":"Go"}</small>${txt}</div><button data-act="t-add">+30s</button><button data-act="t-stop">Done</button></div>`;
}
let wake = null;
async function keepAwake(){ try { if (!wake && navigator.wakeLock) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && state.tab === "today") keepAwake(); });

/* ---------- events ---------- */
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i, j = +b.dataset.j;
  if (act !== "rm" && act !== "log-del") state.confirm = null;
  const s = state.tab === "today" ? currentSession() : null;
  switch (act){
    case "backup-copy": { const txt = backupText(); navigator.clipboard.writeText(txt).then(() => { b.textContent = "Copied"; }, () => { $("imp-text").value = txt; $("imp-text").select(); b.textContent = "Selected below, copy it"; }); return; }
    case "backup-save": backupSave(b); return;
    case "muscle": state.muscle = state.muscle === b.dataset.m ? null : b.dataset.m; break;
    case "expage": state.exPage = b.dataset.name; state.exScroll = scrollY; render(); scrollTo(0,0); return;
    case "expage-close": state.exPage = null; render(); scrollTo(0, state.exScroll || 0); return;
    case "tab": state.exPage = null; state.tab = b.dataset.v; try { localStorage.setItem("pbLog.tab", state.tab); } catch {} render(); scrollTo(0,0); return;
    case "week": state.week = +b.dataset.v; state.session = null; state.menu = null; break;
    case "day": state.day = b.dataset.v; state.session = null; state.menu = null; break;
    case "close-open": state.openId = null; state.session = null; { const t = blockWeekFor(TODAY); state.week = t.week; state.day = dayName(TODAY); } break;
    case "bw-edit": state.bwEdit = true; break;
    case "menu": state.menu = state.menu === i ? null : i; break;
    case "done": {
      keepAwake();
      const ex = s.exercises[i], st = ex.sets[j], p = ex.plan || {};
      if (!st.done){
        const row = b.closest(".setrow");
        const ph = f => row.querySelector(`[data-f="${f}"]`).placeholder;
        if (st.kg === "") st.kg = ph("kg"); if (st.reps === "") st.reps = ph("reps"); if (st.rpe === "") st.rpe = ph("rpe");
        st.done = true; startTimer(restSecs(p.rest));
      } else st.done = false;
      persist(s); break;
    }
    case "addset": { const ex = s.exercises[i]; const l = ex.sets[ex.sets.length-1]; ex.sets.push({kg:l?l.kg:"", reps:"", rpe:"", done:false}); persist(s); break; }
    case "rmset": s.exercises[i].sets.pop(); persist(s); break;
    case "up": case "down": { const k = act==="up" ? i-1 : i+1; [s.exercises[i], s.exercises[k]] = [s.exercises[k], s.exercises[i]]; state.menu = k; persist(s); break; }
    case "rm": if (state.confirm === "rm-"+i){ s.exercises.splice(i,1); state.menu = null; state.confirm = null; persist(s); } else state.confirm = "rm-"+i; break;
    case "finish": s.finished = true; s.finishedAt = Date.now(); state.timer = null; persist(s); scrollTo(0,0); break;
    case "t-add": if (state.timer) state.timer.end += 30000; drawTimer(); return;
    case "t-stop": state.timer = null; drawTimer(); return;
    case "log-toggle": state.logOpen = state.logOpen === b.dataset.id ? null : b.dataset.id; break;
    case "log-edit": { const d = docs[b.dataset.id]; state.openId = b.dataset.id; state.week = d.week; state.day = d.day; state.tab = "today"; render(); scrollTo(0,0); return; }
    case "log-del": { const id = b.dataset.id; if (state.confirm === "del-"+id){ removeDoc(id); state.confirm = null; state.logOpen = null; if (state.openId === id) state.openId = null; state.session = null; } else state.confirm = "del-"+id; break; }
    case "use-logged": { const m = maxes(); const nm = {}; LIFTS.forEach(l => { const h = exerciseHistory({"bench":"Barbell Bench Press","squat":"Back Squat","deadlift":"Conventional Deadlift"}[l]); const b = h.length ? r25(Math.max(...h.map(x=>x.e1))) : 0; nm[l] = Math.max(m[l], b); }); save("settings", {...docs.settings, type:"settings", maxes: nm}); state.session = null; break; }
    case "setplan": save("settings", {...docs.settings, type:"settings", plan: b.dataset.v}); applyPlan(); state.session = null; break;
    case "setweek": { const w = +b.dataset.v; save("settings", {...docs.settings, type:"settings", cycleStart: addDays(mondayOf(TODAY), -(w-1)*7)}); state.week = w; state.session = null; break; }
  }
  render();
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "prog-ex"){ state.progressEx = t.value; render(); return; }
  if (state.tab !== "today") return;
  const s = currentSession(); if (!s) return;
  if (t.dataset.f === "notes"){ s.notes = t.value; persist(s); return; }
  const row = t.closest(".setrow"); if (!row || !t.dataset.f) return;
  s.exercises[+row.dataset.i].sets[+row.dataset.j][t.dataset.f] = t.value.replace(",", ".").trim();
  persist(s);
});
document.addEventListener("change", ev => { if (ev.target.id === "prog-ex"){ state.progressEx = ev.target.value; render(); } });
document.addEventListener("submit", ev => {
  ev.preventDefault();
  const f = ev.target.dataset.form;
  if (f === "bw"){
    const v = parseFloat(($("bw-in").value||"").replace(",", "."));
    if (v > 20 && v < 400){ const entries = {...bwEntries(), [TODAY]: round1(v)}; save("bodyweight", {type:"bodyweight", entries}); state.bwEdit = false; }
    else { $("bw-in").setCustomValidity("Enter your weight in kg, like 82.4"); $("bw-in").reportValidity(); setTimeout(() => $("bw-in") && $("bw-in").setCustomValidity(""), 1500); return; }
  }
  const s = state.tab === "today" ? currentSession() : null;
  if (f === "restore"){ restoreBackup(); return; }
  if (f === "maxes"){
    const nm = {}; for (const l of LIFTS){ const v = parseFloat(($("max-"+l).value||"").replace(",", ".")); if (!(v >= 20 && v <= 500)) { $("max-"+l).setCustomValidity("Enter a max in kg"); $("max-"+l).reportValidity(); setTimeout(() => $("max-"+l) && $("max-"+l).setCustomValidity(""), 1500); return; } nm[l] = v; }
    save("settings", {...docs.settings, type:"settings", maxes: nm}); state.session = null; setSync("Weights updated");
  }
  if (f === "rename" && s){ const i = +ev.target.dataset.i; const n = $("rn-"+i).value.trim(); if (n){ s.exercises[i].name = n; s.exercises[i].main = false; state.menu = null; persist(s); } }
  if (f === "addex" && s){
    const n = $("ax-name").value.trim(); if (!n) return;
    const sets = Math.min(Math.max(parseInt($("ax-sets").value)||3, 1), 10), reps = $("ax-reps").value.trim() || "10";
    s.exercises.push({name:n, main:false, plan:{sets, reps, weight:"your choice", targetKg:null, rpe:"8", rest:"90 s"}, sets:Array.from({length:sets}, newSet)});
    persist(s);
  }
  render();
});

ensureSettings();
{ const t = blockWeekFor(TODAY); state.week = t.week; }
render();
connectDb();
</script>

<script>if("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}</script>
